# The browser mode's sound: a silent sink the cart plays into; the web server records its
# monitor and sends it to the browser (supervisor/alia_runtime/web.py)
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "alia-browser-sink"
          node.description = "Alia Pad simulator (browser)"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
          audio.rate       = 48000
          priority.session = 2000
      }
    }
]
