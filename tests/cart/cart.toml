[cart]
id      = "pad.alia.runtime.test"
title   = "alia-runtime test"
version = "0.0.1"

[runtime]
type  = "python"
entry = "main.py"
pause = "game"          # so the test sees SIGUSR1 / SIGUSR2 too

[permissions]
camera = true           # run with --camera none (ALIA_RT_CAMERA=none): the cart must get the typed "unavailable"
